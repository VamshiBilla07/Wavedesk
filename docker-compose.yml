version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: wavedesk-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: wavedesk
      POSTGRES_PASSWORD: wavedesk
      POSTGRES_DB: wavedesk
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wavedesk -d wavedesk"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: wavedesk-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: wavedesk-backend
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://wavedesk:wavedesk@postgres:5432/wavedesk
      REDIS_URL: redis://redis:6379
      JWT_SECRET: supersecretjwtkeythatisatleast32characterslong
      ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      META_GRAPH_VERSION: v21.0
      META_APP_SECRET: mock_app_secret
      META_VERIFY_TOKEN: wavedesk_verify_token_123
      WHATSAPP_MOCK: "true"
      CORS_ORIGIN: http://localhost:3000
      CAMPAIGN_RATE_PER_SEC: 20
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: wavedesk-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:4000/api
      NEXT_PUBLIC_WS_URL: http://localhost:4000
    depends_on:
      - backend

volumes:
  postgres-data:
  redis-data:
